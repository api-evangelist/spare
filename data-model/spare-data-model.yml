note: >-
  Entity-relationship model derived from the Account Information (AIS) and Payment
  Initiation (PIS) OpenAPI resource groups and the Spare integration-flow docs.
  The core AIS graph is Customer -> Connection/Request -> Consent -> (Account ->
  Balance/Transaction/Beneficiary/DirectDebit/Parties/Statement) with Provider as
  the bank directory. PIS mirrors it with a payment Consent -> Payment.
entities:
