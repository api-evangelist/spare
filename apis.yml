aid: spare
name: Spare
description: >-
  Spare is a MENA-region open banking and open finance platform, licensed by the
  Central Bank of Bahrain as an Account Information Service Provider and Payment
  Initiation Service Provider (AISP/PISP) and permitted to test under the Saudi
  Central Bank (SAMA) regulatory sandbox. Spare exposes RESTful Account
  Information Services (AIS) — account details, balances, transactions,
  statements, beneficiaries, parties, direct debits, plus risk and affordability
  reports — and Payment Initiation Services (PIS) for domestic single,
  future-dated and standing-order payments, across separate Bahrain, KSA and UAE
  tenants hosted in-region for data-residency compliance. Developers authenticate
  with OAuth2 client credentials to obtain signed JWT bearer tokens, drive a
  customer to connection to consent to data flow, verify token and webhook
  signatures against a published JWKS, and integrate via official TypeScript,
  Java, .NET and PHP SDKs plus Postman collections.
