components:
  schemas:
    RequestStatus:
      enum:
      - AwaitingApproval
      - Rejected
      - Approved
      - Expired
      type: string
    ObjectApiResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        errorDescription:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              type: string
        data: {}
      additionalProperties: false
    ConsentStatusHistoryModel:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ObConsentsStatus'
        dateTime:
          type: string
          format: date-time
      additionalProperties: false
    ConsentSource:
      enum:
      - WEB
      - API
      type: string
    AccountInformationRequestAccessResponseModel:
      required:
      - countryCode
      - customerId
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        source:
          $ref: '#/components/schemas/ConsentSource'
        consent:
          $ref: '#/components/schemas/AccountInformationConsentResponseModel'
        country:
          $ref: '#/components/schemas/CountryResponseModel'
        requestPermissions:
          type:
          - array
          - 'null'
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requestLink:
          type:
          - string
          - 'null'
        customerId:
          type: string
          format: uuid
        consentExpiryDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsFromDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsToDate:
          type:
          - string
          - 'null'
          format: date-time
        countryCode:
          minLength: 1
          pattern: ^[A-Z]{2}
          type: string
        redirectionFlow:
          $ref: '#/components/schemas/RedirectionFlow'
        successRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        failureRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        autoRedirect:
          type: boolean
      additionalProperties: false
    ObConsentsStatus:
      enum:
      - AwaitingAuthorization
      - Authorized
      - Authorised
      - Consumed
      - Rejected
      - Expired
      - Revoked
      type: string
    AccountInformationConsentResponseModel:
      type: object
      properties:
        expiryDate:
          type:
          - string
          - 'null'
          format: date-time
        transactionsFromDate:
          type:
          - string
          - 'null'
          format: date-time
        transactionsToDate:
          type:
          - string
          - 'null'
          format: date-time
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
        statusHistory:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConsentStatusHistoryModel'
        connection:
          $ref: '#/components/schemas/AccountInformationConnectionResponseModel'
        id:
          type: string
          format: uuid
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        scope:
          $ref: '#/components/schemas/ConsentScope'
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ObConsentsStatus'
        authorizationLink:
          type:
          - string
          - 'null'
        successRedirectUrl:
          type:
          - string
          - 'null'
        failureRedirectUrl:
          type:
          - string
          - 'null'
      additionalProperties: false
    UpdateAccountInformationRequestAccessModel:
      required:
      - countryCode
      - requestPermissions
      type: object
      properties:
        consentExpiryDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsFromDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsToDate:
          type:
          - string
          - 'null'
          format: date-time
        countryCode:
          minLength: 1
          pattern: ^[A-Z]{2}
          type: string
        requestPermissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformationPermission'
        redirectionFlow:
          $ref: '#/components/schemas/RedirectionFlow'
        successRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        failureRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        autoRedirect:
          type: boolean
      additionalProperties: false
    ProviderStatus:
      enum:
      - Active
      - Inactive
      type: string
    AccountInformationRequestAccessResponseModelApiResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        errorDescription:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              type: string
        data:
          $ref: '#/components/schemas/AccountInformationRequestAccessResponseModel'
      additionalProperties: false
    AccountInformationPermission:
      enum:
      - ReadAccountsBasic
      - ReadAccountsDetail
      - ReadBalances
      - ReadBeneficiariesBasic
      - ReadBeneficiariesDetail
      - ReadDirectDebits
      - ReadTransactionsBasic
      - ReadTransactionsDetail
      - ReadTransactionsCredits
      - ReadTransactionsDebits
      - ReadStatementsBasic
      - ReadStatementsDetail
      - ReadSupplementaryAccountInfo
      - ReadOffers
      - ReadParty
      - ReadPartyCustomer
      - ReadFutureDatedPaymentsBasic
      - ReadFutureDatedPaymentsDetail
      - ReadPAN
      - ReadPartyPSU
      - ReadPartyPSUIdentity
      - ReadScheduledPaymentsBasic
      - ReadScheduledPaymentsDetail
      - ReadStandingOrdersBasic
      - ReadStandingOrdersDetail
      type: string
    PagesModel:
      type: object
      properties:
        currentPageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalNumberOfPages:
          type: integer
          format: int32
      additionalProperties: false
    ConnectionStatus:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
    ConsentScope:
      enum:
      - Accounts
      - Payments
      type: string
    CountryResponseModel:
      required:
      - englishName
      - iso3166Code
      - timeZone
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currency:
          $ref: '#/components/schemas/CurrencyResponseModel'
        englishName:
          maxLength: 50
          minLength: 1
          type: string
        arabicName:
          maxLength: 50
          type:
          - string
          - 'null'
        iso3166Code:
          maxLength: 2
          minLength: 1
          pattern: ^[A-Z]{2}$
          type: string
        timeZone:
          maxLength: 50
          minLength: 1
          type: string
      additionalProperties: false
    AccountInformationRequestAccessModel:
      required:
      - countryCode
      - customerId
      - requestPermissions
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        consentExpiryDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsFromDate:
          type:
          - string
          - 'null'
          format: date-time
        consentTransactionsToDate:
          type:
          - string
          - 'null'
          format: date-time
        countryCode:
          minLength: 1
          pattern: ^[A-Z]{2}
          type: string
        requestPermissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformationPermission'
        redirectionFlow:
          $ref: '#/components/schemas/RedirectionFlow'
        successRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        failureRedirectUrl:
          maxLength: 255
          type:
          - string
          - 'null'
          format: uri
        autoRedirect:
          type: boolean
      additionalProperties: false
    AccountInformationConnectionResponseModel:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/AccountInformationProviderModel'
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ConnectionStatus'
