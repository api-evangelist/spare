openapi: 3.2.0
info:
  title: Spare Transaction API
  termsOfService: https://terms.tryspare.com/en
  version: '1.0'
  description: 'Operations tagged Transaction across 3 of this provider''s published API definitions: spare-bahrain-ais-openapi-original.json, spare-ksa-ais-openapi-original.json, spare-ksa-ais-v2-openapi-original.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Transaction
paths:
  /api/v1.0/ais/Transaction/Get:
    get:
      tags:
      - Transaction
      summary: Get transaction details
      description: '**Unique resource name :** ais.v1.transaction.get


        **Important!:**


        The permissions bellow are required on the consent:

        - `ReadTransactionsBasic`

        - `ReadTransactionsDetail`

        - `ReadTransactionsDebits`

        - `ReadTransactionsCredits`'
      parameters:
      - name: id
        in: query
        description: Transaction id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '500':
          description: Internal Server Error
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailsResponseModelApiResponse'
        '400':
          description: '- If transaction id is not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '404':
          description: '- If transaction does not exist'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
      operationId: getApiV10AisTransactionGet
      x-operation-id-source: derived
  /api/v1.0/ais/Transaction/List:
    post:
      tags:
      - Transaction
      summary: List transactions
      description: '**Unique resource name :** ais.v1.transaction.list


        **Important!:**


        The permissions bellow are required on the consent:

        - ReadTransactionsBasic

        - ReadTransactionsDetail

        - ReadTransactionsDebits

        - ReadTransactionsCredits'
      parameters:
      - name: consentId
        in: query
        description: Consent id
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: query
        description: Bank account id
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: '1'
      - name: perPage
        in: query
        description: Number of items per page maximum allow is 200 per page
        schema:
          type: integer
          format: int32
          default: '20'
      requestBody:
        description: Filter model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/TransactionFilterModel'
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionFilterModel'
          text/json:
            schema:
              $ref: '#/components/schemas/TransactionFilterModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TransactionFilterModel'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '500':
          description: Internal Server Error
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseModelIEnumerablePagesModelMetaApiResponse'
        '400':
          description: '- If consent id is not valid

            - If filter model is not valid

            - If accountId is null or invalid UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '404':
          description: '- If consent does not exist'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
      operationId: postApiV10AisTransactionList
      x-operation-id-source: derived
  /api/v1.0/ais/Transaction/Salaries:
    get:
      tags:
      - Transaction
