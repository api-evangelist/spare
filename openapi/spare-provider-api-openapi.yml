      tags:
      - Provider
      summary: List open banking providers
      description: '**Unique resource name :** ais.v1.provider.list'
      parameters:
      - name: countryCode
        in: query
        description: Country ISO 3166 alpha-2 code
        required: true
        schema:
          pattern: ^[A-Za-z]{2}
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '500':
          description: Internal Server Error
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInformationProviderModelIEnumerableApiResponse'
        '400':
          description: '- If country code is not a valid ISO 3166 alpha-2 code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
      operationId: getApiV10AisProviderList
      x-operation-id-source: derived
  /api/v1.0/pis/Provider/List:
    get:
      tags:
      - Provider
      summary: List open banking providers
      parameters:
      - name: countryCode
        in: query
        description: Country ISO 3166 alpha-2 code
        required: true
        schema:
          pattern: ^[A-Z]{2}
          type: string
      responses:
