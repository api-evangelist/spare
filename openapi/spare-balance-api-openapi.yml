  /api/v1.0/ais/Balance/History:
    get:
      tags:
      - Balance
      summary: Get account balance history
      description: '**Unique resource name :** ais.v1.balance.history


        **Important!:**


        - The maximum allowed date range period is one year.

        - `toDate` need to be greater than `fromDate`


        The permissions bellow are required on the consent:

        - `ReadAccountsBasic`

        - `ReadAccountsDetail`

        - `ReadBalances`

        - `ReadTransactionsBasic`

        - `ReadTransactionsDetail`

        - `ReadTransactionsDebits`

        - `ReadTransactionsCredits`'
      parameters:
      - name: accountId
        in: query
        description: Account id
        required: true
        schema:
          type: string
          format: uuid
      - name: fromBookingDateTime
        in: query
        description: From booking date time
        schema:
          type: string
          format: date-time
      - name: toBookingDateTime
        in: query
        description: To booking date time
        schema:
          type: string
          format: date-time
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
