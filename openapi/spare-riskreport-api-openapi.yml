        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: '1'
      - name: perPage
        in: query
        description: Number of items per page maximum allow is 10 per page
        schema:
          type: integer
          format: int32
          default: '10'
      responses:
        '401':
