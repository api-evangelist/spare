tags:
- name: Statement
paths:
  /api/v1.0/ais/Statement/File:
    get:
      tags:
      - Statement
      summary: Download account statement
      description: '**Unique resource name :** ais.v1.statement.file


        **Important!:**


        - The permissions bellow are required on the consent:

        - `ReadBalances`

        - `ReadTransactionsBasic`

        - `ReadTransactionsDetail`

        - `ReadTransactionsDebits`

        - `ReadTransactionsCredits`'
      parameters:
      - name: accountId
        in: query
        description: Account id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '402':
          description: Payment Required
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '403':
          description: Forbidden
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '500':
          description: Internal Server Error
        '200':
          description: ''
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: '- If accountId is null or invalid UUID

            - if fromBookingDateTime is null

            - if toBookingDateTime is null'
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
        '404':
          description: '- If account not exist'
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectApiResponse'
      operationId: getApiV10AisStatementFile
      x-operation-id-source: derived
